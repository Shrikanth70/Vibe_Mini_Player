<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- PiP Window Gradients -->
    <linearGradient id="pipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2638" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>

    <linearGradient id="pipHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a365d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- PiP Pulsing Shadow -->
    <filter id="pipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      .code-keyword { fill: #ff7b72; font-weight: 600; }
      .code-var { fill: #79c0ff; }
      .code-str { fill: #a5d6ff; }
      .code-prop { fill: #d2a8ff; }
      .code-comment { fill: #8b949e; font-style: italic; }
      .code-terminal { fill: #58a6ff; }
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px #60a5fa); }
      }
      .pip-box {
        animation: pulse 4s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Desktop Canvas Frame -->
  <rect x="0" y="0" width="880" height="500" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.5" />

  <!-- macOS / IDE Window Titlebar -->
  <rect x="0" y="0" width="880" height="42" rx="16" fill="#161b22" />
  <rect x="0" y="26" width="880" height="16" fill="#161b22" />
  <line x1="0" y1="42" x2="880" y2="42" stroke="#30363d" stroke-width="1" />

  <!-- Window Dots -->
  <circle cx="24" cy="21" r="6" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5" />
  <circle cx="44" cy="21" r="6" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5" />
  <circle cx="64" cy="21" r="6" fill="#27c93f" stroke="#1aab29" stroke-width="0.5" />

  <!-- IDE Tab -->
  <rect x="95" y="8" width="220" height="34" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  <text x="115" y="29" class="font-sans" font-size="12" fill="#e6edf3" font-weight="500">📁 workspace — agent-runner.ts</text>

  <!-- Shortcut Pill in Titlebar -->
  <rect x="690" y="10" width="168" height="24" rx="12" fill="#1f293d" stroke="#3b82f6" stroke-width="1" />
  <circle cx="704" cy="22" r="3.5" fill="#34d399" />
  <text x="715" y="26" class="font-mono" font-size="11" fill="#93c5fd" font-weight="600">Alt + L  (Active)</text>

  <!-- ================= IDE EDITOR BODY ================= -->
  <!-- Sidebar -->
  <rect x="0" y="42" width="50" height="458" fill="#0d1117" />
  <line x1="50" y1="42" x2="50" y2="500" stroke="#30363d" stroke-width="1" />

  <!-- Line Numbers -->
  <g class="font-mono" font-size="12" fill="#484f58" text-anchor="end">
    <text x="82" y="78">1</text>
    <text x="82" y="104">2</text>
    <text x="82" y="130">3</text>
    <text x="82" y="156">4</text>
    <text x="82" y="182">5</text>
    <text x="82" y="208">6</text>
    <text x="82" y="234">7</text>
    <text x="82" y="260">8</text>
    <text x="82" y="286">9</text>
    <text x="82" y="312">10</text>
    <text x="82" y="338">11</text>
  </g>

  <!-- Code Content -->
  <g class="font-mono" font-size="13">
    <text x="105" y="78">
      <tspan class="code-keyword">import</tspan> { <tspan class="code-var">Agent</tspan>, <tspan class="code-var">TaskRunner</tspan> } <tspan class="code-keyword">from</tspan> <tspan class="code-str">'@antigravity/core'</tspan>;
    </text>

    <text x="105" y="104">
      <tspan class="code-keyword">const</tspan> <tspan class="code-var">agent</tspan> = <tspan class="code-keyword">new</tspan> <tspan class="code-prop">Agent</tspan>({ <tspan class="code-prop">model</tspan>: <tspan class="code-str">'claude-3.7-sonnet'</tspan>, <tspan class="code-prop">autonomous</tspan>: <tspan class="code-keyword">true</tspan> });
    </text>

    <text x="105" y="130">
      <tspan class="code-comment">// 🚀 Autonomous agent running complex codebase refactoring</tspan>
    </text>

    <text x="105" y="156">
      <tspan class="code-keyword">await</tspan> <tspan class="code-var">agent</tspan>.<tspan class="code-prop">executeTask</tspan>({
    </text>

    <text x="125" y="182">
      <tspan class="code-prop">prompt</tspan>: <tspan class="code-str">'Harden authentication services &amp; optimize DB queries'</tspan>,
    </text>

    <text x="125" y="208">
      <tspan class="code-prop">verificationMode</tspan>: <tspan class="code-str">'test-driven'</tspan>
    </text>

    <text x="105" y="234">});</text>

    <text x="105" y="270">
      <tspan class="code-comment">// Notice: You switched over to the IDE, but your stream NEVER vanished!</tspan>
    </text>
    <text x="105" y="296">
      <tspan class="code-comment">// Vibe Mini Player keeps your video floating on top of all windows.</tspan>
    </text>
  </g>

  <!-- Interactive Terminal Drawer at Bottom -->
  <rect x="65" y="340" width="460" height="135" rx="10" fill="#090d13" stroke="#30363d" stroke-width="1" />
  <g class="font-mono" font-size="11.5">
    <text x="82" y="365" fill="#38bdf8">❯ claude task --status</text>
    <text x="82" y="388" fill="#4ade80">✔ Analysis complete: 14 source files indexed</text>
    <text x="82" y="411" fill="#facc15">⚡ [AI Agent]: Executing test suite (52 / 52 passed)...</text>
    <text x="82" y="434" fill="#94a3b8">ℹ Video stream playing simultaneously without interruption 🎵</text>
    <text x="82" y="457" fill="#64748b">[Waiting for code review...]</text>
  </g>

  <!-- ================= ALWAYS-ON-TOP MINI PLAYER WINDOW ================= -->
  <g class="pip-box" filter="url(#pipGlow)" transform="translate(530, 160)">
    <!-- PiP Window Body -->
    <rect x="0" y="0" width="315" height="195" rx="12" fill="url(#pipGrad)" stroke="#3b82f6" stroke-width="2" />

    <!-- PiP Window Header -->
    <rect x="0" y="0" width="315" height="30" rx="12" fill="url(#pipHeaderGrad)" />
    <rect x="0" y="16" width="315" height="14" fill="url(#pipHeaderGrad)" />
    <line x1="0" y1="30" x2="315" y2="30" stroke="#2563eb" stroke-width="1" stroke-opacity="0.4" />

    <!-- PiP Mini Icon & Title -->
    <g transform="translate(10, 8)">
      <rect x="0" y="0" width="14" height="10" rx="1.5" fill="none" stroke="#60a5fa" stroke-width="1.2" />
      <rect x="7.5" y="5" width="5.5" height="4" rx="0.8" fill="#60a5fa" />
      <text x="20" y="10" class="font-sans" font-size="10.5" fill="#dbeafe" font-weight="600">YouTube — Vibe Mini Player</text>
    </g>

    <!-- Always-on-top badge -->
    <rect x="232" y="6" width="73" height="17" rx="8.5" fill="#1e3a8a" stroke="#60a5fa" stroke-width="0.8" />
    <text x="241" y="18" class="font-sans" font-size="9" fill="#bfdbfe" font-weight="bold">ALWAYS ON TOP</text>

    <!-- Simulated Video Playback Canvas -->
    <rect x="8" y="38" width="299" height="147" rx="8" fill="#040711" />

    <!-- Animated Waveform / Ambient art in video -->
    <path d="M 12 115 Q 80 50, 155 110 T 303 105" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.6" />
    <path d="M 12 125 Q 90 70, 160 120 T 303 118" fill="none" stroke="#8b5cf6" stroke-width="1.8" opacity="0.5" />

    <!-- Play Center Icon -->
    <circle cx="157" cy="100" r="22" fill="#1d4ed8" fill-opacity="0.3" stroke="#60a5fa" stroke-width="1.5" />
    <polygon points="152,90 167,100 152,110" fill="#93c5fd" />

    <!-- Video Subtitle / Song Title -->
    <text x="157" y="138" class="font-sans" font-size="11" fill="#f1f5f9" font-weight="600" text-anchor="middle">Lofi Girl — Beats to relax/code to ☕</text>
    <text x="157" y="153" class="font-sans" font-size="9.5" fill="#94a3b8" text-anchor="middle">Live Stream • 24/7 Continuous Audio</text>

    <!-- Native PiP Scrubbing Controls Bar -->
    <rect x="18" y="165" width="279" height="12" rx="4" fill="#0f172a" opacity="0.9" />
    <text x="26" y="174" class="font-mono" font-size="8.5" fill="#94a3b8">-10s</text>
    <circle cx="157" cy="171" r="3" fill="#ef4444" />
    <text x="268" y="174" class="font-mono" font-size="8.5" fill="#94a3b8">+10s</text>
  </g>

  <!-- Floating Drag Hint -->
  <g transform="translate(620, 375)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="80" y="18" class="font-sans" font-size="11" fill="#cbd5e1" font-weight="500" text-anchor="middle">✨ Drag anywhere on screen</text>
  </g>
</svg>
